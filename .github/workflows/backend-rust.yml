name: Backend Rust
on:
  push:
    paths: ['packages/backend-rust/**', 'scripts/build/backend-rust*', '.github/workflows/backend-rust.yml']
  pull_request:
    paths: ['packages/backend-rust/**', 'scripts/build/backend-rust*', '.github/workflows/backend-rust.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: online-adapter
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d online-adapter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_TARGET_DIR: built/target
    defaults:
      run:
        working-directory: packages/backend-rust
    steps:
      - uses: actions/checkout@v7.0.0
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - run: rustup toolchain install 1.99.0 --component rustfmt --component clippy --profile minimal
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked -p misskey-backend-postgres -- --ignored
        env:
          MISSKEY_POSTGRES_TEST_CONFIG: ${{ github.workspace }}/packages/backend-rust/storage-postgres/tests/fixtures/local.json
      - run: cargo test --locked -p misskey-api-runtime redis::tests -- --include-ignored
        env:
          MISSKEY_RUST_REDIS_TEST_URL: redis://127.0.0.1:6379/15
