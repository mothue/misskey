name: Test (frontend)

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages/frontend/**
      # for permissions
      - packages/misskey-js/**
      # for e2e
      - packages/backend/**
      - .github/workflows/test-frontend.yml
      - .github/misskey/test.yml
  pull_request:
    branches-ignore:
      - master
    paths:
      - packages/frontend/**
      # for permissions
      - packages/misskey-js/**
      # for e2e
      - packages/backend/**
      - .github/workflows/test-frontend.yml
      - .github/misskey/test.yml
jobs:
  vitest:
    name: Unit tests (frontend)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.0
      with:
        submodules: true
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.4'

    - run: bun install --frozen-lockfile
    - name: Check bun.lock
      run: git diff --exit-code bun.lock
    - name: Copy Configure
      run: cp .github/misskey/test.yml .config
    - name: Build
      run: bun run build
    - name: Test
      run: bun run --filter frontend test
    - name: Upload Coverage
      if: ${{ hashFiles('packages/frontend/coverage/coverage-final.json') != '' }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./packages/frontend/coverage/coverage-final.json

  e2e:
    name: E2E tests (frontend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:8
        ports:
          - 56312:6379

    steps:
    - uses: actions/checkout@v7.0.0
      with:
        submodules: true
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
          bun-version: '1.4.4'

    - run: bun install --frozen-lockfile
    - name: Copy Configure
      run: cp .github/misskey/test.yml .config
    - name: Build
      run: bun run build
    - name: Playwright install
      working-directory: packages/frontend
      run: bunx playwright install --with-deps chromium
    - name: Test
      run: bun run start-server-and-test "bun run start:test" http://localhost:61812 "bun run --filter frontend test:e2e"
      timeout-minutes: 15
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: playwright-e2e-artifacts
        path: packages/frontend/test/e2e/artifacts
