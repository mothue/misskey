name: Lint

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages/backend/**
      - packages/frontend/**
      - packages/frontend-shared/**
      - packages/frontend-builder/**
      - packages/frontend-embed/**
      - packages/icons-subsetter/**
      - packages/sw/**
      - packages/misskey-js/**
      - packages/misskey-bubble-game/**
      - packages/misskey-reversi/**
      - packages/shared/eslint.config.js
      - scripts/checks/declarations*.mjs
      - .github/workflows/lint.yml
      - package.json
  pull_request:
    branches-ignore:
      - master
    paths:
      - packages/backend/**
      - packages/frontend/**
      - packages/frontend-shared/**
      - packages/frontend-builder/**
      - packages/frontend-embed/**
      - packages/icons-subsetter/**
      - packages/sw/**
      - packages/misskey-js/**
      - packages/misskey-bubble-game/**
      - packages/misskey-reversi/**
      - packages/shared/eslint.config.js
      - scripts/checks/declarations*.mjs
      - .github/workflows/lint.yml
      - package.json
jobs:
  bun_install:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        submodules: true
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.2'

    - run: bun install --frozen-lockfile

  lint:
    needs: [bun_install]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace:
        - backend
        - frontend
        - frontend-shared
        - frontend-builder
        - frontend-embed
        - icons-subsetter
        - sw
        - misskey-js
        - misskey-bubble-game
        - misskey-reversi
    env:
      eslint-cache-version: v1
      eslint-cache-path: ${{ github.workspace }}/node_modules/.cache/eslint-${{ matrix.workspace }}
    steps:
    - uses: actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        submodules: true
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.2'

    - run: bun install --frozen-lockfile
    - name: Restore eslint cache
      uses: actions/cache@v6.1.0
      with:
        path: ${{ env.eslint-cache-path }}
        key: eslint-${{ env.eslint-cache-version }}-${{ matrix.workspace }}-${{ hashFiles('**/bun.lock') }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: eslint-${{ env.eslint-cache-version }}-${{ matrix.workspace }}-${{ hashFiles('**/bun.lock') }}-
    - run: bun run --filter ${{ matrix.workspace }} eslint --cache --cache-location ${{ env.eslint-cache-path }} --cache-strategy content

  typecheck:
    needs: [bun_install]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace:
        - backend
        - frontend
        - sw
        - misskey-js
    steps:
    - uses: actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        submodules: true
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.2'

    - run: bun install --frozen-lockfile
    - run: bun run build
    - name: Verify Vue typecheck detects template errors
      if: matrix.workspace == 'frontend'
      run: bun test scripts/checks/vue-typecheck.test.mjs --timeout 60000
    - run: bun run --filter ${{ matrix.workspace }} typecheck

  check-dts:
    needs: [bun_install]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.0
      with:
        fetch-depth: 0
        submodules: true
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.2'

    - run: bun install --frozen-lockfile
    - run: node --test scripts/checks/declarations.test.mjs
    - run: bun run check:declarations
