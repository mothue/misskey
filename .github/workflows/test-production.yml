name: Test (production install and build)

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches-ignore:
      - master

env:
  NODE_ENV: production

jobs:
  production:
    name: Production build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.0
      with:
        submodules: true
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.2'

    - run: bun install --frozen-lockfile
    - name: Check bun.lock
      run: git diff --exit-code bun.lock
    - name: Copy Configure
      run: cp .github/misskey/test.yml .config/default.yml
    - name: Build
      run: bun run build
