name: API report (misskey.js)

on:
  push:
    paths:
      - packages/misskey-js/**
      - .github/workflows/api-misskey-js.yml
  pull_request:
    branches-ignore:
      - master
    paths:
      - packages/misskey-js/**
      - .github/workflows/api-misskey-js.yml
jobs:
  report:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'


      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run --filter misskey-js build

      - name: Check files
        run: ls packages/misskey-js/built

      - name: API report
        run: bun run --filter misskey-js api-prod

      - name: Show report
        if: always()
        run: cat packages/misskey-js/temp/misskey-js.api.md
