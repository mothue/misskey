name: Locale

on:
  push:
    paths:
      - packages/i18n/**
      - locales/**
      - .github/workflows/locale.yml
  pull_request:
    branches-ignore:
      - master
    paths:
      - packages/i18n/**
      - locales/**
      - .github/workflows/locale.yml
jobs:
  locale_verify:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run --filter i18n build
      - name: Verify Locales
        working-directory: ./packages/i18n
        run: bun run verify
