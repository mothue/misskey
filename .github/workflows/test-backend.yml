name: Test (backend)

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages/backend/**
      # for permissions
      - packages/misskey-js/**
      - .github/workflows/test-backend.yml
      - .github/misskey/test.yml
  pull_request:
    branches-ignore:
      - master
    paths:
      - packages/backend/**
      # for permissions
      - packages/misskey-js/**
      - .github/workflows/test-backend.yml
      - .github/misskey/test.yml
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (backend)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version-file:
          - .node-version
          - .github/min.node-version

    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:8
        ports:
          - 56312:6379
      meilisearch:
        image: getmeili/meilisearch:v1.49.0
        ports:
          - 57712:7700
        env:
          MEILI_NO_ANALYTICS: true
          MEILI_ENV: development

    steps:
    - uses: actions/checkout@v7.0.0
      with:
        submodules: true
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.2'
    - name: Install FFmpeg
      run: |
        sudo apt update
        sudo apt install -y ffmpeg
    - run: bun install --frozen-lockfile
    - name: Check bun.lock
      run: git diff --exit-code bun.lock
    - name: Copy Configure
      run: cp .github/misskey/test.yml .config
    - name: Build
      run: bun run build
    - name: Test
      run: bun run --filter backend test
    - name: Upload to Codecov
      if: ${{ hashFiles('packages/backend/coverage/coverage-final.json') != '' }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./packages/backend/coverage/coverage-final.json

  e2e:
    name: E2E tests (backend)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version-file:
          - .node-version
          - .github/min.node-version

    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:8
        ports:
          - 56312:6379

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - run: bun install --frozen-lockfile
      - name: Check bun.lock
        run: git diff --exit-code bun.lock
      - name: Copy Configure
        run: cp .github/misskey/test.yml .config
      - name: Build
        run: bun run build
      - name: Test
        run: bun run --filter backend test:e2e
      - name: Upload to Codecov
        if: ${{ hashFiles('packages/backend/coverage/coverage-final.json') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/backend/coverage/coverage-final.json

  migration:
    name: Migration tests (backend)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version-file:
          - .node-version
          #- .github/min.node-version

    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Get current date
        id: current-date
        run: echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - run: bun install --frozen-lockfile
      - name: Check bun.lock
        run: git diff --exit-code bun.lock
      - name: Copy Configure
        run: cp .github/misskey/test.yml .config
      - name: Build
        run: bun run build
      - name: Run migrations
        run: MISSKEY_CONFIG_YML=test.yml bun run --filter backend migrate
      - name: Check no migrations are remaining
        run: MISSKEY_CONFIG_YML=test.yml bun run --filter backend check-migrations
