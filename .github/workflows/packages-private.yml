name: Lint and test packages-private

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages-private/**
      - packages/shared/eslint.config.js
      - package.json
      - bun.lock
      - bun.lock
      - .github/workflows/packages-private.yml
  pull_request:
    branches-ignore:
      - master
    paths:
      - packages-private/**
      - packages/shared/eslint.config.js
      - package.json
      - bun.lock
      - bun.lock
      - .github/workflows/packages-private.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - diagnostics-shared
          - diagnostics-backend
          - diagnostics-frontend
          - changelog-checker
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - run: bun install --frozen-lockfile
      # lint = typecheck + eslint
      - run: bun run --filter ${{ matrix.workspace }} lint
      # 各パッケージは必ず test スクリプトを持たせる (無いと missing test script で落ちる)
      - run: bun run --filter ${{ matrix.workspace }} test
