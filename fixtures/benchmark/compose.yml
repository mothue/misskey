services:
  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:54412:5432"
    environment:
      POSTGRES_DB: misskey-benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d misskey-benchmark"]
      interval: 1s
      timeout: 3s
      retries: 60
    volumes:
      - postgres:/var/lib/postgresql
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:56412:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 60
volumes:
  postgres:
