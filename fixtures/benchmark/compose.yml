services:
  postgres:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    ports:
      - "127.0.0.1:54412:5432"
    environment:
      POSTGRES_DB: misskey-benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d misskey-benchmark"]
      interval: 1s
      timeout: 3s
      retries: 60
    volumes:
      - postgres:/var/lib/postgresql
  redis:
    image: redis:7@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
    ports:
      - "127.0.0.1:56412:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 60
volumes:
  postgres:
