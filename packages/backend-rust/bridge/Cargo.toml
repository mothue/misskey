[package]
name = "misskey-backend-rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
misskey-backend-core = { path = "../core" }
misskey-backend-postgres = { path = "../storage-postgres" }
misskey-api-runtime = { path = "../api-runtime" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
